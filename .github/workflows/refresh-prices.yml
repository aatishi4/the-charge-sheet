name: Refresh fuel and electricity prices

# Updates data/fuel-prices.json from the EIA API: gasoline every week (EIA publishes
# Monday afternoon) and residential electricity every month. Needs a free key from
# https://www.eia.gov/opendata/register.php saved as the repository secret EIA_API_KEY
# (Settings > Secrets and variables > Actions). Without it the job does nothing.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * 2'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python3 tools/refresh_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-prices.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh fuel and electricity prices"
            git push
          fi
