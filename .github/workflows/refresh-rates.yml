name: Refresh utility rates

# Rebuilds data/rates/ (the ZIP code rate lookup on the home charging calculator)
# from two free public datasets: EIA Form 861 ZIP-to-utility averages and the
# OpenEI Utility Rate Database bulk download. No API key needed.
# Runs weekly (it only commits when the data actually changes), on demand, and whenever the build script changes.
# If the OpenEI rate database is down, the last good plans are kept and the next run picks them up.

on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_rates.py
      - .github/workflows/refresh-rates.yml
  schedule:
    - cron: '41 10 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build rate lookup
        shell: bash
        run: |
          set -o pipefail
          if ! python3 tools/build_rates.py 2>&1 | tee build.log; then
            echo "::error title=build_rates.py failed::$(tail -n 8 build.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice title=Rate lookup built::$(tail -n 1 build.log)"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh utility rate lookup"
            git push
          fi
