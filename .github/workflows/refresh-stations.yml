name: Refresh station snapshot

# Rebuilds data/stations.json from the AFDC station database once a month.
# Add your own key as a repository secret named NLR_API_KEY
# (Settings > Secrets and variables > Actions). Without it, the public
# DEMO_KEY is used, which works for one monthly call.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 3 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build station snapshot
        env:
          NREL_API_KEY: ${{ secrets.NLR_API_KEY || 'DEMO_KEY' }}
        run: node tools/build-data.mjs --stations
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh station snapshot"
            git push
          fi
