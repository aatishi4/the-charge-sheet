name: Scheduled publish

# Blog posts with a `publish:` time stay off chargesheet.io until a build runs
# after that time. This checks every half hour through the US morning and rebuilds
# the site if a post is due but not in the live feed yet. When nothing is due it does nothing.
# Why so many runs: GitHub starts scheduled workflows late. In this repo the 14:00 and 15:00 UTC
# runs were starting around 19:00 to 20:00 UTC, so a 9am Central post went up mid-afternoon.
# Starting the checks at 09:09 UTC means one of them lands close to 9am Central either way.

on:
  schedule:
    - cron: '9,39 9-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find posts that are due but not live
        id: due
        run: python3 tools/due_posts.py >> "$GITHUB_OUTPUT"
      - name: Rebuild the site
        if: steps.due.outputs.missing != ''
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          MISSING: ${{ steps.due.outputs.missing }}
        run: |
          echo "Due and not live: $MISSING"
          if [ -n "$HOOK" ]; then
            # Cloudflare Pages deploy hook (Settings > Builds > Deploy hooks, branch main)
            curl -fsS -X POST "$HOOK"
          else
            # No hook set: an empty commit on main makes Cloudflare Pages rebuild.
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Scheduled publish: $MISSING"
            git push
          fi
