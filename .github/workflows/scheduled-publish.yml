name: Scheduled publish

# Backstop only. The Cloudflare Worker in workers/scheduled-publish/ is what publishes
# scheduled posts on time (see DEPLOY.md section 10). GitHub starts scheduled workflows
# hours late in this repo, sometimes not at all, so this just catches anything the Worker
# missed: if a post is due but not in the live feed, it rebuilds the site.
# Set the CF_DEPLOY_HOOK secret so it rebuilds through the hook instead of an empty commit.
# Run it by hand from the Actions tab any time a post is late.

on:
  schedule:
    - cron: '9,39 9-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find posts that are due but not live
        id: due
        run: python3 tools/due_posts.py >> "$GITHUB_OUTPUT"
      - name: Rebuild the site
        if: steps.due.outputs.missing != ''
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          MISSING: ${{ steps.due.outputs.missing }}
        run: |
          echo "Due and not live: $MISSING"
          if [ -n "$HOOK" ]; then
            # Cloudflare Pages deploy hook (Settings > Builds > Deploy hooks, branch main)
            curl -fsS -X POST "$HOOK"
          else
            # No hook set: an empty commit on main makes Cloudflare Pages rebuild.
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Scheduled publish: $MISSING"
            git push
          fi
